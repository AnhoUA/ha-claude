# Мишу обробляє сам веб-термінал, а не tmux: тоді текст виділяється звичайним протягуванням
# і копіюється через Cmd+C або Ctrl+C
set -g mouse off
# Без альтернативного екрана вивід потрапляє в історію веб-термінала,
# тож прокрутка коліщатком працює і без mouse у tmux
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set -g history-limit 50000
set -g default-terminal "tmux-256color"
# Передавати копіювання (OSC 52, наприклад «c to copy» у Claude) у буфер обміну браузера
set -g set-clipboard on
set -ga terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'
# Передавати гіперпосилання OSC 8 у веб-термінал. Claude виводить так посилання для входу,
# тож воно відкривається кліком повністю, хоч на екрані й розбите на рядки
set -as terminal-features ',xterm*:hyperlinks'
# Без рядка стану tmux у терміналі немає зайвого рядка внизу
set -g status off
